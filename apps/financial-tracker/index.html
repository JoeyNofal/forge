Views.forecast = {
  render() {
    const rows = Views.forecast.generate();
    const bills = App.calc.upcoming30DayBills();
    return `
    <div class="section-header"><div class="section-title">52-Week Forecast</div></div>
    <div class="card">
      <div class="card-title">Upcoming Bills</div>
      <div class="card-subtitle">Next 30 days</div>
      ${bills.length ? `
        <table class="data-table">
          <thead><tr><th>Due Date</th><th>Expense</th><th>Amount</th><th>Frequency</th></tr></thead>
          <tbody>${bills.map(b=>`<tr><td>${App.fmtDate(b.date)}</td><td class="desc">${b.name}</td><td class="neg">${App.fmt(b.amount)}</td><td>${b.freq}</td></tr>`).join('')}</tbody>
        </table>
      ` : '<div class="empty-state"><p>No bills in the next 30 days.</p></div>'}
    </div>
    <div class="card">
      <div class="card-title">52-Week Projection</div>
      <div class="card-subtitle">Weekly paycheck and balance forecast</div>
      <div style="overflow-x:auto">
        <div class="forecast-row header">
          <div>Wk</div><div>Pay Date</div><div>Hrs</div><div>Net Pay</div><div>VAULT Est.</div><div>Car Loan Est.</div>
        </div>
        ${rows.map(r=>`
          <div class="forecast-row">
            <div style="color:var(--text3)">${r.week}</div>
            <div>${App.fmtDate(r.payDate)}</div>
            <div style="color:var(--text2)">${r.hours}</div>
            <div style="color:var(--green)">${App.fmt(r.netPay)}</div>
            <div style="color:${r.vault<0?'var(--red)':'var(--text2)'}">${App.fmt(r.vault)}</div>
            <div style="color:var(--text2)">${App.fmt(Math.max(0,r.carLoan))}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
  },
  generate() {
    const rows = [];
    let vault = App.data.accounts.vault;
    let carLoan = App.data.accounts.car_loan;
    const monthlyTarget = App.data.settings.carLoanMonthlyTarget;
    const weeklyCarPayment = monthlyTarget / 4.33;
    const weeklyFixed = App.calc.weeklyFixedExpenses();
    const weeklyGroceries = App.calc.avgGroceries() / 4;

    // Start from next paycheck date
    let payDate = App.calc.nextPaycheckDate();

    for (let w=1; w<=52; w++) {
      // Work week Monday = payDate - 7 days (work week ends previous Friday)
      const fh = Number(App.data.settings.forecastFixedHours);
      const hours = App.data.settings.forecastHoursMode === 'alternating'
        ? (App.calc.isAlternatingSunday(new Date(new Date(payDate).setDate(payDate.getDate()-7))) ? 48 : 36)
        : (fh > 0 && fh <= 168 ? fh : 40);   // 40 hours every week, unless the settings say 'alternating' (old 48/36 pattern)
      const pred = App.calc.predictNetPay({regular:hours, overtime:0, holiday:0, pto:0, nightshift:0, bonus:0});
      vault += pred.net - weeklyFixed - weeklyGroceries;
      carLoan = Math.max(0, carLoan - weeklyCarPayment);
      rows.push({ week:w, payDate:new Date(payDate), hours, netPay:pred.net, vault, carLoan });
      payDate = new Date(payDate); payDate.setDate(payDate.getDate()+7);
    }
    return rows;
  },
  init() {}
};

              <td></td>
            </tr>`;

      </table>

  getMonths() {
    const s = App.data.settings;
    const months=[]; let y=s.groceryStartYear, m=s.groceryStartMonth;

      m++; if(m>12){m=1;y++;}
    }

    }
  }
};

  },
  saveExpense(id) {
    const name = document.getElementById('ex-name').value.trim();
    const amount = parseFloat(document.getElementById('ex-amount').value);
    const frequency = document.getElementById('ex-freq').value;
    const dueDay = parseInt(document.getElementById('ex-dueday').value)||null;
    const startDate = document.getElementById('ex-start').value||null;
    const endDate = document.getElementById('ex-end').value||null;
    if (!name||isNaN(amount)||amount<=0) { App.showToast('Fill name and amount','error'); return; }
    if (id) {
      const idx = App.data.fixedExpenses.findIndex(e=>e.id===id);
      if(idx>=0) App.data.fixedExpenses[idx]={...App.data.fixedExpenses[idx],name,amount,frequency,dueDay,startDate,endDate};
    } else {
      App.data.fixedExpenses.push({id:App.uid(),name,amount,frequency,dueDay,startDate,endDate});
    }
    App.scheduleSave(); App.closeModal(); App.renderCurrentView();
    App.showToast('Expense saved','success');
  },
  deleteExpense(id) {
    App.data.fixedExpenses = App.data.fixedExpenses.filter(e=>e.id!==id);
    App.scheduleSave(); App.renderCurrentView();
  },
  
  resetData() {
    if(!confirm('This will permanently delete ALL your data. Are you sure?')) return;
    if(!confirm('Last chance — this cannot be undone.')) return;
    App.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
    App.scheduleSave(); App.renderCurrentView();
    App.showToast('All data reset');
  },
  init() {}
};

// ── START ──
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
