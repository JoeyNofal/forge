<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Tracker</title>

<script src="vendor/chart.umd.js"></script>
<script src="vendor/exceljs.min.js"></script>
<script src="dates.js"></script>
<script src="bills.js"></script>
<style>
/* fonts saved locally (SIL Open Font License, see vendor/fonts) so the app works with no internet */
@font-face { font-family: 'DM Serif Display'; font-style: normal; font-weight: 400; font-display: swap; src: url("vendor/fonts/dm-serif-display-latin-400-normal.woff2") format('woff2'); }
@font-face { font-family: 'DM Serif Display'; font-style: italic; font-weight: 400; font-display: swap; src: url("vendor/fonts/dm-serif-display-latin-400-italic.woff2") format('woff2'); }
@font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 300; font-display: swap; src: url("vendor/fonts/dm-sans-latin-300-normal.woff2") format('woff2'); }
@font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url("vendor/fonts/dm-sans-latin-400-normal.woff2") format('woff2'); }
@font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 500; font-display: swap; src: url("vendor/fonts/dm-sans-latin-500-normal.woff2") format('woff2'); }
@font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 600; font-display: swap; src: url("vendor/fonts/dm-sans-latin-600-normal.woff2") format('woff2'); }
@font-face { font-family: 'DM Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url("vendor/fonts/dm-mono-latin-400-normal.woff2") format('woff2'); }
@font-face { font-family: 'DM Mono'; font-style: normal; font-weight: 500; font-display: swap; src: url("vendor/fonts/dm-mono-latin-500-normal.woff2") format('woff2'); }
:root {
  --bg: #0f0f11;
  --surface: #18181c;
  --surface2: #222228;
  --surface3: #2a2a32;
  --border: #2e2e38;
  --accent: #c8a96e;
  --accent2: #7eb8a4;
  --accent3: #e07b7b;
  --text: #f0ede8;
  --text2: #a09890;
  --text3: #6a6460;
  --green: #6db891;
  --red: #e07b7b;
  --yellow: #d4a84b;
  --blue: #7eb8d4;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --font-display: 'DM Serif Display', serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'DM Mono', monospace;
  --nav-width: 220px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── SIDEBAR NAV ── */
#sidebar {
  width: var(--nav-width);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  z-index: 10;
}
#sidebar-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--border);
}
#sidebar-header h1 {
  font-family: var(--font-display);
  font-size: 1.25rem;
  color: var(--accent);
  letter-spacing: 0.01em;
  line-height: 1.2;
}
#sidebar-header p {
  font-size: 0.7rem;
  color: var(--text3);
  margin-top: 3px;
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
#nav-links {
  flex: 1;
  padding: 12px 0;
  overflow-y: auto;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  cursor: pointer;
  color: var(--text2);
  font-size: 0.875rem;
  font-weight: 400;
  border-left: 3px solid transparent;
  transition: all 0.15s;
  user-select: none;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active {
  color: var(--accent);
  border-left-color: var(--accent);
  background: rgba(200,169,110,0.07);
  font-weight: 500;
}
.nav-icon { font-size: 1rem; width: 20px; text-align: center; }

#sidebar-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
}
#file-status {
  font-size: 0.7rem;
  font-family: var(--font-mono);
  color: var(--text3);
  margin-bottom: 8px;
}
#file-status span { color: var(--green); }
#load-file-btn {
  width: 100%;
  padding: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text2);
  font-size: 0.75rem;
  cursor: pointer;
  font-family: var(--font-body);
  transition: all 0.15s;
}
#load-file-btn:hover { background: var(--surface3); color: var(--text); }

/* ── MAIN CONTENT ── */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

#topbar {
  height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  flex-shrink: 0;
}
#topbar-title {
  font-family: var(--font-display);
  font-size: 1.1rem;
  color: var(--text);
}
#topbar-right { display: flex; align-items: center; gap: 12px; }

#save-indicator {
  font-size: 0.7rem;
  font-family: var(--font-mono);
  color: var(--text3);
}
#save-indicator.saved { color: var(--green); }
#save-indicator.saving { color: var(--yellow); }

#content {
  flex: 1;
  overflow-y: auto;
  padding: 28px 28px;
  scrollbar-width: thin;
  scrollbar-color: var(--surface3) transparent;
}

/* ── CARDS & GRID ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
}
.card-title {
  font-family: var(--font-display);
  font-size: 1rem;
  color: var(--text);
  margin-bottom: 4px;
}
.card-subtitle {
  font-size: 0.72rem;
  color: var(--text3);
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 16px;
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

.balance-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.balance-card .label {
  font-size: 0.7rem;
  color: var(--text3);
  font-family: var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-bottom: 6px;
}
.balance-card .amount {
  font-family: var(--font-mono);
  font-size: 1.4rem;
  font-weight: 500;
}
.balance-card .amount.pos { color: var(--green); }
.balance-card .amount.neg { color: var(--red); }
.balance-card .amount.neutral { color: var(--text); }
.balance-card .sub-label {
  font-size: 0.68rem;
  color: var(--text3);
  margin-top: 4px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 0.68rem;
  font-family: var(--font-mono);
  font-weight: 500;
  margin-top: 6px;
}
.badge-green { background: rgba(109,184,145,0.15); color: var(--green); border: 1px solid rgba(109,184,145,0.3); }
.badge-red { background: rgba(224,123,123,0.15); color: var(--red); border: 1px solid rgba(224,123,123,0.3); }
.badge-yellow { background: rgba(212,168,75,0.15); color: var(--yellow); border: 1px solid rgba(212,168,75,0.3); }
.badge-blue { background: rgba(126,184,212,0.15); color: var(--blue); border: 1px solid rgba(126,184,212,0.3); }
.badge-accent { background: rgba(200,169,110,0.15); color: var(--accent); border: 1px solid rgba(200,169,110,0.3); }

/* ── ALERTS ── */
#alerts-bar {
  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;
}
.alert-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 500;
}
.alert-chip.warn { background: rgba(212,168,75,0.12); border: 1px solid rgba(212,168,75,0.3); color: var(--yellow); }
.alert-chip.info { background: rgba(126,184,212,0.12); border: 1px solid rgba(126,184,212,0.3); color: var(--blue); }
.alert-chip.crit { background: rgba(224,123,123,0.12); border: 1px solid rgba(224,123,123,0.3); color: var(--red); }

/* ── TABLES ── */
.data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.data-table th {
  text-align: left; padding: 10px 12px;
  font-size: 0.68rem; font-family: var(--font-mono); text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--text3);
  border-bottom: 1px solid var(--border);
  font-weight: 400;
}
.data-table td {
  padding: 10px 12px;
  border-bottom: 1px solid rgba(46,46,56,0.6);
  color: var(--text2);
  font-family: var(--font-mono);
  font-size: 0.8rem;
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: rgba(255,255,255,0.02); color: var(--text); }
.data-table td.desc { font-family: var(--font-body); color: var(--text); }
.data-table td.pos { color: var(--green); }
.data-table td.neg { color: var(--red); }

/* ── FORMS ── */
.form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.form-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 140px; }
.form-group label { font-size: 0.72rem; color: var(--text3); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; }
.form-group input, .form-group select, .form-group textarea {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 9px 12px;
  font-size: 0.85rem;
  font-family: var(--font-body);
  outline: none;
  transition: border-color 0.15s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--accent);
}
.form-group select option { background: var(--surface2); }

.btn {
  padding: 9px 18px;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  font-family: var(--font-body);
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  border: none;
}
.btn-primary { background: var(--accent); color: #1a1408; }
.btn-primary:hover { background: #d4b87a; }
.btn-secondary { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--surface3); color: var(--text); }
.btn-danger { background: rgba(224,123,123,0.15); color: var(--red); border: 1px solid rgba(224,123,123,0.3); }
.btn-danger:hover { background: rgba(224,123,123,0.25); }
.btn-sm { padding: 5px 12px; font-size: 0.75rem; }

/* ── PROGRESS BARS ── */
.progress-bar { height: 6px; background: var(--surface3); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.progress-fill.green { background: var(--green); }
.progress-fill.yellow { background: var(--yellow); }
.progress-fill.red { background: var(--red); }
.progress-fill.accent { background: var(--accent); }

/* ── SECTION TITLES ── */
.section-header {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 16px;
}
.section-title {
  font-family: var(--font-display);
  font-size: 1.5rem;
  color: var(--text);
}
.section-date {
  font-size: 0.72rem;
  font-family: var(--font-mono);
  color: var(--text3);
}

/* ── CHART CONTAINERS ── */
.chart-container { position: relative; height: 220px; }
.chart-container-lg { position: relative; height: 300px; }

/* ── PAYCHECK SPECIFIC ── */
.paycheck-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
}
.paycheck-card.approved { border-left: 3px solid var(--green); }
.paycheck-card.predicted { border-left: 3px solid var(--yellow); }
.paycheck-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.paycheck-date { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text3); }
.paycheck-net { font-family: var(--font-mono); font-size: 1.3rem; color: var(--green); font-weight: 500; }
.paycheck-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.paycheck-field { font-size: 0.72rem; }
.paycheck-field .pf-label { color: var(--text3); font-family: var(--font-mono); text-transform: uppercase; font-size: 0.62rem; letter-spacing: 0.06em; }
.paycheck-field .pf-val { color: var(--text); font-family: var(--font-mono); margin-top: 2px; }
.paycheck-actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }

/* ── LEDGER ── */
.ledger-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.ledger-tab {
  padding: 6px 14px; border-radius: 20px;
  font-size: 0.75rem; font-family: var(--font-mono); text-transform: uppercase;
  letter-spacing: 0.05em; cursor: pointer; border: 1px solid var(--border);
  background: var(--surface2); color: var(--text3); transition: all 0.15s;
}
.ledger-tab.active { background: rgba(200,169,110,0.15); color: var(--accent); border-color: rgba(200,169,110,0.4); }

/* ── CREDIT SCORE ── */
.score-display {
  text-align: center; padding: 20px;
}
.score-number {
  font-family: var(--font-display);
  font-size: 4rem;
  line-height: 1;
}
.score-label { font-size: 0.75rem; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 6px; }

/* ── SETTINGS ── */
.setting-group { margin-bottom: 24px; }
.setting-group-title {
  font-size: 0.7rem; font-family: var(--font-mono); text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--accent); margin-bottom: 14px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border);
}

/* ── EXPENSE LIST ── */
.expense-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.expense-item:last-child { border-bottom: none; }
.expense-name { font-size: 0.85rem; color: var(--text); }
.expense-meta { font-size: 0.72rem; color: var(--text3); font-family: var(--font-mono); margin-top: 2px; }
.expense-amount { font-family: var(--font-mono); font-size: 0.9rem; color: var(--text2); }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }

/* ── TOAST ── */
#toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 20px;
  font-size: 0.82rem; color: var(--text); z-index: 9999;
  box-shadow: var(--shadow); transition: transform 0.3s;
  pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); }
#toast.success { border-color: rgba(109,184,145,0.4); }
#toast.error { border-color: rgba(224,123,123,0.4); }

/* ── FORECAST ── */
.forecast-row { display: grid; grid-template-columns: 40px 100px 80px 90px 110px 110px; gap: 8px; padding: 8px 0; border-bottom: 1px solid rgba(46,46,56,0.5); font-family: var(--font-mono); font-size: 0.75rem; align-items: center; }
.forecast-row.header { color: var(--text3); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; border-bottom-color: var(--border); padding-bottom: 10px; }
.forecast-row:hover { background: rgba(255,255,255,0.01); }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  z-index: 100; display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; width: 500px;
  max-width: 95vw; max-height: 85vh; overflow-y: auto;
  transform: translateY(20px); transition: transform 0.2s;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-title { font-family: var(--font-display); font-size: 1.2rem; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center; padding: 48px 20px; color: var(--text3);
}
.empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.4; }
.empty-state p { font-size: 0.85rem; }

/* file picker hidden */
#file-input { display: none; }

/* data file problem screen (covers the whole app, saving is off while it shows) */
#load-problem { position: fixed; inset: 0; z-index: 9999; background: rgba(15,15,17,0.97); align-items: center; justify-content: center; }
.lp-box { max-width: 560px; padding: 28px; border: 1px solid var(--red); border-radius: 12px; background: var(--surface); }
.lp-box h2 { color: var(--red); margin-bottom: 10px; }
.lp-box p { margin: 8px 0; line-height: 1.5; }
.lp-path { font-family: monospace; word-break: break-all; color: var(--accent); }
.lp-btns { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.lp-btns button { padding: 8px 14px; cursor: pointer; background: var(--surface2); color: var(--text); border: 1px solid var(--accent); border-radius: 6px; }
</style>
</head>
<body>

<!-- SIDEBAR -->
<nav id="sidebar">
  <div id="sidebar-header">
    <h1>Vault</h1>
    <p>Financial OS</p>
  </div>
  <div id="nav-links">
    <div class="nav-item active" data-view="dashboard"><span class="nav-icon">◈</span> Dashboard</div>
    <div class="nav-item" data-view="inputs"><span class="nav-icon">⊕</span> Inputs</div>
    <div class="nav-item" data-view="paychecks"><span class="nav-icon">◎</span> Paychecks</div>
    <div class="nav-item" data-view="ledgers"><span class="nav-icon">≡</span> Ledgers</div>
    <div class="nav-item" data-view="forecast"><span class="nav-icon">⟶</span> Forecast</div>
    <div class="nav-item" data-view="groceries"><span class="nav-icon">◻</span> Groceries</div>
    <div class="nav-item" data-view="credit"><span class="nav-icon">◇</span> Credit Score</div>
    <div class="nav-item" data-view="settings"><span class="nav-icon">⚙</span> Settings</div>
  </div>
  <div id="sidebar-footer">
    <div id="file-status">Data: <span id="file-name-display">No file loaded</span></div>
    <button id="load-file-btn">↑ Load / Change File</button>
    <button id="import-old-btn" style="width:100%;padding:7px;margin-top:6px;background:var(--surface2);border:1px dashed rgba(200,169,110,0.3);border-radius:var(--radius-sm);color:var(--accent);font-size:0.72rem;cursor:pointer;font-family:var(--font-body);transition:all 0.15s" title="Import data exported from the old app">⇄ Import from Old App</button>
  </div>
</nav>

<!-- MAIN -->
<div id="main">
  <div id="topbar">
    <div id="topbar-title">Dashboard</div>
    <div id="topbar-right">
      <div id="save-indicator">—</div>
    </div>
  </div>
  <div id="content">
    <div id="view-container"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- DATA FILE PROBLEM (blocks the whole app, turns saving off) -->
<div id="load-problem" style="display:none">
  <div class="lp-box">
    <h2 id="lp-title"></h2>
    <p id="lp-msg"></p>
    <p class="lp-path" id="lp-path"></p>
    <div class="lp-btns">
      <button id="lp-choose">Choose another file…</button>
      <button id="lp-create">Create a new empty file here</button>
      <button id="lp-backups">Open backups folder</button>
    </div>
  </div>
</div>

<!-- FILE INPUT -->
<input type="file" id="file-input" accept=".json" style="display:none">
<input type="file" id="import-old-input" accept=".json" style="display:none">

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ============================================================
// DATA LAYER
// ============================================================
const DEFAULT_DATA = {
  accounts: { vault: 0, flex: 0, funds: 0, cc: 0, cc2: 0, car_loan: 0, brex: 0 },
  fundsSubAccounts: { carFund: 0, savingsFund: 0 },
  transactions: [],   // {id, accountId, date, description, amount, balance, type}
  paychecks: [],      // {id, date, workWeekEnd, hours, bonus, grossPay, taxes, deductions, netPay, approved}
  fixedExpenses: [],  // {id, name, amount, frequency, dueDay, startDate, endDate, account}
  groceries: {},      // "YYYY-MM": number
  creditScores: [],   // {id, date, score, source, notes, type} type = 'vantage' or 'fico'
  settings: {
    regularRate: 35.21,

const App = {
  data: JSON.parse(JSON.stringify(DEFAULT_DATA)),
  fileHandle: null,
  currentView: 'dashboard',
  charts: {},
  saveTimeout: null,
  saveBlocked: false,   // true while the data file was not loaded safely: nothing may be saved
  dirty: false,         // true while there are edits not yet written to the file
  failStreak: 0,        // how many saves in a row have failed

  // ── FILE I/O (Electron native) ──
  async loadFile() {
    try {
      if (window.electronAPI) {
        const result = await window.electronAPI.loadFile();
        if (!result.ok) {
          if (result.problem) App.showToast('Could not open that file: ' + (result.problem.error || result.problem.state) + ' (your current data is unchanged)', 'error');
          return;
        }
        App.data = App.mergeWithDefaults(JSON.parse(result.data));
        App.saveBlocked = false; App.dirty = false; App.hideLoadProblem();
        const name = result.path.split('\\').pop().split('/').pop();
        document.getElementById('file-name-display').textContent = name;
        App.renderCurrentView();
        App.showToast('Data loaded successfully', 'success');
      } else {
        // Browser fallback
        if (window.showOpenFilePicker) {
          const [handle] = await window.showOpenFilePicker({
            types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
          });
          App.fileHandle = handle;
          const file = await handle.getFile();
          const text = await file.text();
          App.data = App.mergeWithDefaults(JSON.parse(text));
          document.getElementById('file-name-display').textContent = file.name;
          App.renderCurrentView();
          App.showToast('Data loaded successfully', 'success');
        } else {
          document.getElementById('file-input').click();
        }
      }
    } catch(e) {
      if (e.name !== 'AbortError') App.showToast('Failed to load file: ' + e.message, 'error');
    }
  },

  async importOldData(fileOrNull) {
    try {
      let raw;
      if (window.electronAPI) {
        const result = await window.electronAPI.importFile();
        if (!result.ok) return;
        raw = JSON.parse(result.data);
      } else {
        // Browser: fileOrNull is a File object
        const text = await fileOrNull.text();
        raw = JSON.parse(text);
      }

      let parsed = raw;
      const isLocalStorageDump = Object.keys(raw).some(k => k.startsWith('financial_tracker_'));
      if (isLocalStorageDump) {
        parsed = {};
        for (const [k, v] of Object.entries(raw)) {
          const cleanKey = k.replace('financial_tracker_', '');
          try { parsed[cleanKey] = typeof v === 'string' ? JSON.parse(v) : v; }
          catch(e) { parsed[cleanKey] = v; }
        }
      }
      if (parsed.data) parsed = parsed.data;

      const merged = App.mergeWithDefaults(parsed);
      if (App.data.conversations.length) merged.conversations = App.data.conversations;
      if (App.data.creditScores.length)  merged.creditScores  = App.data.creditScores;

      const counts = {
        transactions: merged.transactions.length,
        paychecks: merged.paychecks.length,
        expenses: merged.fixedExpenses.length,
        groceryMonths: Object.keys(merged.groceries).length
      };

      App.data = merged;
      App.renderCurrentView();
      App.scheduleSave();
      App.showToast(`Imported: ${counts.transactions} transactions, ${counts.paychecks} paychecks, ${counts.expenses} expenses, ${counts.groceryMonths} grocery months`, 'success');
    } catch(e) {
      console.error('Import error:', e);
      App.showToast(`Import failed: ${e.message}`, 'error');
    }
  },

  async loadFileFromInput(file) {
    try {
      const text = await file.text();
      App.data = App.mergeWithDefaults(JSON.parse(text));
      document.getElementById('file-name-display').textContent = file.name;
      App.renderCurrentView();
      App.showToast('Data loaded', 'success');
    } catch(e) {
      App.showToast('Failed to load file', 'error');
    }
  },

  mergeWithDefaults(loaded) {
    const d = JSON.parse(JSON.stringify(DEFAULT_DATA));

    // ── NEW APP FORMAT ──
    if (loaded.accounts && !Array.isArray(loaded.accounts)) {
      // Plain object — just merge it
      d.accounts = { ...d.accounts, ...loaded.accounts };
    }
    // ── OLD APP FORMAT: accounts stored as array of {id, name, type, balance} ──
    if (Array.isArray(loaded.accounts)) {
      loaded.accounts.forEach(a => {
        const id = a.id;
        if (id && d.accounts.hasOwnProperty(id)) {
          d.accounts[id] = typeof a.balance === 'number' ? a.balance : 0;
        }
      });
    }

    if (loaded.fundsSubAccounts) {
      // old app stored laptopFund too — just ignore it
      d.fundsSubAccounts.carFund = loaded.fundsSubAccounts.carFund || 0;
      d.fundsSubAccounts.savingsFund = loaded.fundsSubAccounts.savingsFund || 0;
    }

    // Transactions — both formats use same shape
    if (loaded.transactions) d.transactions = loaded.transactions;

    // Paychecks — both formats use same shape
    if (loaded.paychecks) d.paychecks = loaded.paychecks;

    // Fixed expenses — old app stored as array under 'fixedExpenses' in settings or top-level
    if (loaded.fixedExpenses) d.fixedExpenses = loaded.fixedExpenses;
    // Old app sometimes stored under settings._fixedExpenses
    if (!loaded.fixedExpenses && loaded.settings && loaded.settings._fixedExpenses) {
      d.fixedExpenses = loaded.settings._fixedExpenses;
    }

    // Groceries — old app stored under 'grocery_totals' key
    if (loaded.groceries) d.groceries = loaded.groceries;
    if (!loaded.groceries && loaded.grocery_totals) d.groceries = loaded.grocery_totals;

    if (loaded.creditScores) d.creditScores = loaded.creditScores;

    // Settings — merge carefully so old app keys map correctly
    if (loaded.settings) {
      const s = loaded.settings;
      d.settings = { ...d.settings, ...s };
      // Old app used paycheckParams sub-object
      if (s.paycheckParams) {
        d.settings.regularRate = s.paycheckParams.regularRate || d.settings.regularRate;
        d.settings.overtimeMultiplier = s.paycheckParams.overtimeMultiplier || d.settings.overtimeMultiplier;
        d.settings.nightshiftMultiplier = s.paycheckParams.nightshiftMultiplier || d.settings.nightshiftMultiplier;
        d.settings.benefitsDeduction = s.paycheckParams.benefitsDeduction || d.settings.benefitsDeduction;
        d.settings.otherDeductions = s.paycheckParams.otherDeductions || d.settings.otherDeductions;
        d.settings.retirementPercent = s.paycheckParams.retirementPercent || d.settings.retirementPercent;
      }
      if (s.savingsGoals) {
        d.settings.carFundTarget = s.savingsGoals.carFundTarget || d.settings.carFundTarget;
        d.settings.carFundMinimum = s.savingsGoals.carFundMinimum || d.settings.carFundMinimum;
      }
      if (s.creditCard) {
        d.settings.ccLimit = s.creditCard.limit || d.settings.ccLimit;
        d.settings.ccPaymentDueDay = s.creditCard.paymentDueDay || d.settings.ccPaymentDueDay;
        d.settings.ccStatementDay = s.creditCard.statementDay || d.settings.ccStatementDay;
      }
      if (s.carLoan) {
        d.settings.carLoanInitial = s.carLoan.initialBalance || d.settings.carLoanInitial;
      }
      if (s.flexFloor !== undefined) d.settings.flexFloor = s.flexFloor;
      if (s.workSchedule && s.workSchedule.alternatingSundayStart) {
        d.settings.alternatingSundayStart = s.workSchedule.alternatingSundayStart;
      }
    }

    // ── ALWAYS rebuild account balances from latest transaction per account ──
    // Transactions are the source of truth. accounts{} may be stale or zeroed.
    const accountIds = ['vault','flex','funds','cc','cc2','car_loan','brex'];
    accountIds.forEach(id => {
      const acctTxns = d.transactions
        .filter(t => t.accountId === id && t.balance !== undefined && t.balance !== null)
        .sort((a,b) => new Date(a.date) - new Date(b.date) || 0);
      if (acctTxns.length > 0) {
        d.accounts[id] = acctTxns[acctTxns.length - 1].balance;
      }
    });

    // ── Rebuild fundsSubAccounts from FUNDS balance ──
    const fundsBalance = d.accounts.funds;
    if (fundsBalance > 0) {
      // Use loaded subaccounts if they sum correctly, otherwise recalculate
      const loadedCar = d.fundsSubAccounts.carFund;
      const loadedSav = d.fundsSubAccounts.savingsFund;
      const sum = loadedCar + loadedSav;
      if (Math.abs(sum - fundsBalance) < 1) {
        // Already consistent, keep them
      } else {
        // Recalculate split
        const carFund = Math.floor(fundsBalance / 2 / 500) * 500;
        d.fundsSubAccounts = { carFund, savingsFund: fundsBalance - carFund };
      }
    }

    return d;
  },

  scheduleSave() {
    const ind = document.getElementById('save-indicator');
    if (App.saveBlocked) {
      ind.textContent = 'NOT SAVED'; ind.className = '';
      App.showToast('Saving is OFF: the data file was not loaded safely.', 'error');
      return;
    }
    App.dirty = true;
    ind.textContent = 'Saving…'; ind.className = 'saving';
    clearTimeout(App.saveTimeout);
    App.saveTimeout = setTimeout(App.saveFile, 800);
  },

  // Write any pending edit right now (used when the window is closing).
  async flushNow() {
    clearTimeout(App.saveTimeout);
    if (App.saveBlocked || !App.dirty) return;
    await App.saveFile();
  },

  async saveFile() {
    const ind = document.getElementById('save-indicator');
    if (App.saveBlocked) return;
    const json = JSON.stringify(App.data, null, 2);
    let saved = false, why = '';
    try {
      if (window.electronAPI) {
        // Electron: save directly to file via main process
        const result = await window.electronAPI.saveData(json);
        if (result && result.ok) saved = true; else why = (result && result.error) || 'unknown error';
      } else if (App.fileHandle) {
        const writable = await App.fileHandle.createWritable();
        await writable.write(json); await writable.close();
        saved = true;
      } else {
        const blob = new Blob([json], {type:'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'financial-tracker-data.json';
        a.click(); URL.revokeObjectURL(a.href);
        saved = true;
      }
    } catch(e) { why = e.message; }
    if (saved) {
      App.failStreak = 0; App.dirty = false;
      ind.textContent = 'Saved ✓'; ind.className = 'saved';
      setTimeout(() => { if (!App.dirty) { ind.textContent = '—'; ind.className = ''; } }, 3000);
    } else {
      // Never give up silently: keep the edit in memory, say so, and try again in 5 seconds.
      App.failStreak++;
      ind.textContent = 'SAVE FAILED - retrying'; ind.className = '';
      if (App.failStreak === 1) App.showToast('Save failed: ' + why + ' (will retry)', 'error');
      clearTimeout(App.saveTimeout);
      App.saveTimeout = setTimeout(App.saveFile, 5000);
    }
  },

  // Shown when the data file is missing/unreadable. Turns saving off and covers the app.
  showLoadProblem(info) {
    App.saveBlocked = true;
    clearTimeout(App.saveTimeout);
    const missing = !!info && info.state === 'missing';
    document.getElementById('lp-title').textContent = missing ? 'Data file not found' : 'Data file could not be read safely';
    document.getElementById('lp-msg').textContent = missing
      ? 'No data file exists at the location below. Nothing has been created or changed. Choose your real file, or create a new empty one here.'
      : 'Reason: ' + ((info && (info.error || info.state)) || 'unknown') + '. Your file has NOT been changed. Saving is turned off until a good file is loaded.';
    document.getElementById('lp-path').textContent = (info && info.path) || '(no path set)';
    document.getElementById('lp-create').style.display = missing ? '' : 'none';
    document.getElementById('lp-backups').style.display = missing ? 'none' : '';
    document.getElementById('load-problem').style.display = 'flex';
  },

  hideLoadProblem() { document.getElementById('load-problem').style.display = 'none'; },

  async createNewFile() {
    if (!window.electronAPI) return;
    const r = await window.electronAPI.createNewFile(JSON.stringify(DEFAULT_DATA));
    if (!r || !r.ok) { App.showToast('Could not create the file: ' + ((r && r.error) || 'unknown error'), 'error'); return; }
    App.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
    App.saveBlocked = false; App.dirty = false; App.hideLoadProblem();

  },

  // ── FINANCIAL CALCULATIONS ──
  calc: {
    weeklyFixedExpenses() {
      const now = new Date();
      return App.data.fixedExpenses.reduce((t, e) => {
        if (e.endDate && new Date(e.endDate) < now) return t;
        if (e.startDate && new Date(e.startDate) > now) return t;
        if (e.frequency === 'monthly') return t + e.amount / 4.33;
        if (e.frequency === 'biweekly') return t + e.amount / 2;
        if (e.frequency === 'weekly') return t + e.amount;
        return t;
      }, 0);
    },
    monthlyExpenses() {
      const avgGroceries = App.calc.avgGroceries();
      return App.data.fixedExpenses.reduce((t, e) => {
        if (e.frequency === 'monthly') return t + e.amount;
        if (e.frequency === 'biweekly') return t + e.amount * (26/12);
        if (e.frequency === 'weekly') return t + e.amount * 4.33;
        return t;
      }, 0) + avgGroceries;
    },
    avgGroceries() {
      const vals = Object.values(App.data.groceries);
      return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
    },
    vaultBufferTarget() {
      const m = App.calc.monthlyExpenses();
      return m * (App.data.settings.vaultBufferMonths + 1) + 1500;
    },
    vaultBufferStatus() {
      const vault = App.data.accounts.vault;
      const m = App.calc.monthlyExpenses();
      if (vault < m*2) return {status:'Critical', color:'red'};
      if (vault < m*6) return {status:'Low', color:'yellow'};
      if (vault < App.calc.vaultBufferTarget()) return {status:'In Progress', color:'blue'};
      return {status:'Safe', color:'green'};
    },
    flexAllowance() {
      const weeklyGroceries = App.calc.avgGroceries() / 4.33;
      const fuel = App.data.fixedExpenses.find(e => e.name === 'Fuel');
      const fun = App.data.fixedExpenses.find(e => e.name === 'Fun');
      const weeklyFuel = fuel ? fuel.amount : 0;
      const weeklyFun = fun ? fun.amount : 0;
      const cc = Math.max(0, App.data.accounts.cc);
      const cc2 = Math.max(0, App.data.accounts.cc2);
      const base = weeklyGroceries + weeklyFuel + weeklyFun + cc + cc2;
      return Math.ceil(base / 10) * 10;
    },
    predictNetPay(hours) {
      const s = App.data.settings;
      const gross = (hours.regular||0)*s.regularRate
        + (hours.overtime||0)*s.regularRate*s.overtimeMultiplier
        + (hours.holiday||0)*s.regularRate
        + (hours.pto||0)*s.regularRate
        + (hours.nightshift||0)*s.regularRate*s.nightshiftMultiplier
        + (hours.bonus||0);
      // avg tax rates from approved paychecks
      const approved = App.data.paychecks.filter(p=>p.approved);
      let rates = {federal:0.12, socialSecurity:0.062, medicare:0.0145, indiana:0.0323, stJoseph:0.0175};
      if (approved.length > 0) {
        const totG = approved.reduce((a,p)=>a+(p.grossPay||0),0);
        if (totG > 0) {
          rates.federal = approved.reduce((a,p)=>a+(p.taxes?.federal||0),0)/totG;
          rates.socialSecurity = approved.reduce((a,p)=>a+(p.taxes?.socialSecurity||0),0)/totG;
          rates.medicare = approved.reduce((a,p)=>a+(p.taxes?.medicare||0),0)/totG;
          rates.indiana = approved.reduce((a,p)=>a+(p.taxes?.indiana||0),0)/totG;
          rates.stJoseph = approved.reduce((a,p)=>a+(p.taxes?.stJoseph||0),0)/totG;
        }
      }
      const taxes = gross * (rates.federal+rates.socialSecurity+rates.medicare+rates.indiana+rates.stJoseph);
      const retirement = gross * (s.retirementPercent/100);
      const net = gross - taxes - retirement - s.benefitsDeduction - s.otherDeductions;
      return { gross, taxes, retirement, net, rates };
    },
    isAlternatingSunday(mondayDate) {
      const startStr = App.data.settings.alternatingSundayStart;
      const start = new Date(startStr);
      const startDay = start.getDay();
      const daysToMon = startDay === 1 ? 0 : startDay === 0 ? 1 : startDay-1;
      const firstMon = new Date(start);
      firstMon.setDate(start.getDate()-daysToMon);
      if (mondayDate < firstMon) return false;
      const ms = 7*24*60*60*1000;
      const weeks = Math.floor((mondayDate-firstMon)/ms);
      return weeks % 4 < 2;
    },
    nextFriday(from) {
      const d = new Date(from); const day = d.getDay();
      const diff = day <= 5 ? 5-day : 7-day+5;
      d.setDate(d.getDate()+diff); return d;
    },
    upcoming30DayBills() {   // bills.js: plain calendar dates, due-today kept, day 31 clamped, start/end dates respected
      return FTBills.upcomingBills(App.data.fixedExpenses, FTDates.todayStr(), 30)
        .map(b => ({ name: b.name, amount: b.amount, date: FTDates.parseDate(b.date), freq: b.freq }));
    },
    nextPaycheckDate() {
      const todayS = FTDates.todayStr();
      const approved = App.data.paychecks.filter(p => p.approved && FTDates.toDateStr(p.date)).map(p => FTDates.toDateStr(p.date)).sort();
      if (!approved.length) return App.calc.nextFriday(new Date());
      let next = FTDates.addDays(approved[approved.length-1], 7);
      while (next && FTDates.compare(next, todayS) < 0) next = FTDates.addDays(next, 7);   // a payday that is TODAY still counts as the next paycheck
      if (!next) return App.calc.nextFriday(new Date());
      return App.calc.nextFriday(FTDates.parseDate(next));
    },
    fundsReallocation(balance) {
      const carFund = Math.floor(balance/2/500)*500;
      return { carFund, savingsFund: balance-carFund };
    },
    creditRating(score) {
      if (score >= 800) return {label:'Exceptional', color:'green'};
      if (score >= 740) return {label:'Very Good', color:'green'};
      if (score >= 670) return {label:'Good', color:'accent'};
      if (score >= 580) return {label:'Fair', color:'yellow'};
      return {label:'Poor', color:'red'};
    },

    paycheckRecommendation(paycheck) {
      if (!paycheck) return null;
      const net = paycheck.netPay || 0;
      const flex = App.calc.flexAllowance();

      // What's left after FLEX takes its allowance
      let remaining = net - flex;
      if (remaining < 0) remaining = 0;

      // Current state
      const currentFunds = App.data.accounts.funds;
      const currentVault = App.data.accounts.vault;
      const vaultTarget = App.calc.vaultBufferTarget();

      // Last FUNDS transaction savings balance
      const fundsTxns = App.data.transactions
        .filter(t => t.accountId === 'funds' && t.balance !== undefined)
        .sort((a, b) => new Date(a.date) - new Date(b.date));
      const lastFundsTxn = fundsTxns.length ? fundsTxns[fundsTxns.length - 1] : null;
      const lastFundsBalance = lastFundsTxn ? lastFundsTxn.balance : currentFunds;
      const lastSavings = Math.floor(lastFundsBalance / 2 / 500) % 1 === 0
        ? lastFundsBalance - Math.floor(lastFundsBalance / 2 / 500) * 500
        : 0;
      const lastCarFund = Math.floor(lastFundsBalance / 2 / 500) * 500;

      // Calculate current car fund and savings fund
      const currentCarFund = Math.floor(currentFunds / 2 / 500) * 500;
      const currentSavings = currentFunds - currentCarFund;

      // Priority 1 — Car fund needs to be at $1,500
      const carFundTarget = App.data.settings.carFundTarget || 1500;
      let toFunds = 0;
      let carFundNote = '';
      let savingsNote = '';
      let vaultNote = '';

      // How much FUNDS total balance is needed for car fund to hit $1,500?
      // carFund = floor(FUNDS/2/500)*500 >= 1500 means FUNDS >= 3000
      const fundsNeededForCarTarget = 3000;

      if (currentFunds < fundsNeededForCarTarget) {
        // Car fund below target — top it up first
        const neededForCar = fundsNeededForCarTarget - currentFunds;
        toFunds = Math.min(remaining, neededForCar);
        carFundNote = `Car Fund top-up: ${App.fmt(toFunds)}`;
        remaining -= toFunds;
      } else {
        carFundNote = `Car Fund: at target ✓`;
      }

      // Priority 2 — Savings fund needs to be $100 more than last FUNDS transaction savings
      const savingsTarget = lastSavings + 100;
      const savingsShortfall = savingsTarget - currentSavings;
      let toSavings = 0;

      if (savingsShortfall > 0 && remaining > 0) {
        // Need to add enough to FUNDS so savings fund reaches target
        // Since savings = FUNDS - carFund, and carFund stays the same if we add small amounts,
        // we need to add savingsShortfall to FUNDS
        toSavings = Math.min(remaining, savingsShortfall);
        toFunds += toSavings;
        savingsNote = `Savings Fund +${App.fmt(toSavings)}`;
        remaining -= toSavings;
      } else {
        savingsNote = currentSavings >= savingsTarget ? `Savings Fund: on track ✓` : `Savings Fund: no funds left`;
      }

      // Priority 3 — Rest goes to VAULT
      const toVault = remaining;
      if (currentVault >= vaultTarget) {
        vaultNote = `VAULT: at target ✓ — extra ${App.fmt(toVault)} to FUNDS`;
        toFunds += toVault;
      } else {
        vaultNote = `VAULT buffer: ${App.fmt(toVault)}`;
      }

      return {
        netPay: paycheck.netPay,
        date: paycheck.date,
        approved: paycheck.approved,
        flex,
        toFunds,
        toVault: currentVault >= vaultTarget ? 0 : toVault,
        carFundNote,
        savingsNote,
        vaultNote
      };
    }
  },

  // ── INIT ──
  init() {
    // Nav
    document.querySelectorAll('.nav-item').forEach(el => {
      el.addEventListener('click', () => App.navigate(el.dataset.view));
    });
    // File
    document.getElementById('load-file-btn').addEventListener('click', App.loadFile);
    document.getElementById('file-input').addEventListener('change', e => {
      if (e.target.files[0]) App.loadFileFromInput(e.target.files[0]);
    });
    document.getElementById('import-old-btn').addEventListener('click', () => {
      if (window.electronAPI) {
        App.importOldData(null); // Electron handles file dialog internally
      } else {
        document.getElementById('import-old-input').click();
      }
    });
    document.getElementById('import-old-input').addEventListener('change', e => {
      if (e.target.files[0]) App.importOldData(e.target.files[0]);
    });
    
    // Modal close
    document.getElementById('modal-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('modal-overlay')) App.closeModal();
    });
    
    // Auto-open file picker (browser only — Electron handles this via IPC)
    if (!window.electronAPI) {
      setTimeout(async () => {
        if (window.showOpenFilePicker) {
          try { await App.loadFile(); } catch(e) { /* user cancelled */ }
        }
      }, 500);
    }

    // Electron: receive initial data pushed from main process
    if (window.electronAPI) {
      window.electronAPI.onInitialData(({ path, data }) => {
        try {
          App.data = App.mergeWithDefaults(JSON.parse(data));
          const name = path.split('\\').pop().split('/').pop();
          const nameEl = document.getElementById('file-name-display');
          nameEl.textContent = name; nameEl.title = path;
          App.saveBlocked = false; App.dirty = false; App.hideLoadProblem();
          App.renderCurrentView();
        } catch(e) {
          console.error('Failed to load initial data:', e);
          App.showLoadProblem({ path, state: 'corrupt', error: 'the file could not be processed: ' + e.message });
        }
      });
      window.electronAPI.onLoadProblem(info => App.showLoadProblem(info));
      window.electronAPI.onFlushRequest(async () => {
        try { await App.flushNow(); } catch(e) { /* closing anyway */ }
        window.electronAPI.flushDone();
      });
      document.getElementById('lp-choose').addEventListener('click', App.loadFile);
      document.getElementById('lp-backups').addEventListener('click', () => window.electronAPI.openBackupsFolder());
      document.getElementById('lp-create').addEventListener('click', App.createNewFile);
      // Get app info for API key status
      
    }
    // Render
    App.renderCurrentView();
  }
};

            id: App.uid(),

            description: 'Manual Balance Correction',

      for (let i=89;i>=0;i--) { const d=new Date(now); d.setDate(d.getDate()-i); days.push(d); }
      const getBalOn = (acctId, date) => {
        const relevant = txns.filter(t=>t.accountId===acctId&&new Date(t.date)<=date);
        return relevant.length ? relevant[relevant.length-1].balance : 0;
      };
      App.charts['trend-chart'] = new Chart(document.getElementById('trend-chart'), {
        type:'line',
        data:{
          labels: days.map(d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'})).filter((_,i)=>i%15===0||i===89),
          datasets:[
            {label:'VAULT',data:days.filter((_,i)=>i%15===0||i===89).map(d=>getBalOn('vault',d)),borderColor:'#6db891',backgroundColor:'rgba(109,184,145,0.08)',tension:0.3,pointRadius:2},
            {label:'FLEX',data:days.filter((_,i)=>i%15===0||i===89).map(d=>getBalOn('flex',d)),borderColor:'#c8a96e',backgroundColor:'rgba(200,169,110,0.08)',tension:0.3,pointRadius:2},
          ]
        },
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#a09890',font:{size:11}}}},scales:{x:{ticks:{color:'#6a6460',font:{size:10}},grid:{color:'rgba(46,46,56,0.6)'}},y:{ticks:{color:'#6a6460',callback:v=>'$'+v.toLocaleString(),font:{size:10}},grid:{color:'rgba(46,46,56,0.6)'}}}}
      });
      // Spending chart
      const months=[]; const labels=[];
      for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d);labels.push(d.toLocaleDateString('en-US',{month:'short'}));}
      const income=months.map(m=>{const end=new Date(m.getFullYear(),m.getMonth()+1,0);return txns.filter(t=>t.amount>0&&new Date(t.date)>=m&&new Date(t.date)<=end).reduce((a,t)=>a+t.amount,0);});
      const expenses=months.map(m=>{const end=new Date(m.getFullYear(),m.getMonth()+1,0);return Math.abs(txns.filter(t=>t.amount<0&&new Date(t.date)>=m&&new Date(t.date)<=end).reduce((a,t)=>a+t.amount,0));});
      App.charts['spending-chart'] = new Chart(document.getElementById('spending-chart'), {
        type:'bar',
        data:{labels,datasets:[{label:'Income',data:income,backgroundColor:'rgba(109,184,145,0.6)',borderColor:'#6db891',borderWidth:1},{label:'Expenses',data:expenses,backgroundColor:'rgba(224,123,123,0.6)',borderColor:'#e07b7b',borderWidth:1}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#a09890',font:{size:11}}}},scales:{x:{ticks:{color:'#6a6460',font:{size:10}},grid:{color:'rgba(46,46,56,0.6)'}},y:{ticks:{color:'#6a6460',callback:v=>'$'+v.toLocaleString(),font:{size:10}},grid:{color:'rgba(46,46,56,0.6)'}}}}
      });
    }
  }
};

      <!-- Preset buttons -->
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        <button class="btn btn-secondary btn-sm" onclick="Views.inputs.applyPreset('flex')">
          Weekly FLEX — ${App.fmt(flexAmt)}
        </button>

          Weekly FUNDS — ${App.fmt(fundsAmt)}

        <div class="form-group"><label>From</label>

          <select id="tf-to"><option value="flex">FLEX</option><option value="vault">VAULT</option><option value="funds">FUNDS</option><option value="cc">FREEDOM (Chase)</option><option value="cc2">SAVOR (Capital One)</option><option value="car_loan">Car Loan</option><option value="brex">BREX</option></select>

          <input type="number" id="tf-amount" placeholder="200.00" step="0.01" min="0">

    </div>`;
  },

  getDescriptions() {
    // Get hidden list from settings
    const hidden = App.data.settings.hiddenDescriptions || [];

    // Fixed expenses as suggestions
    const fixedDescs = App.data.fixedExpenses.map(e => ({
      label: e.name,
      amount: -e.amount,
      accountId: e.account || null,
      source: 'fixed'
    }));

    // Past transaction descriptions sorted by frequency
    const freqMap = {};
    App.data.transactions.forEach(t => {
      if (!t.description) return;
      freqMap[t.description] = (freqMap[t.description] || 0) + 1;
    });
    const pastDescs = Object.entries(freqMap)
      .sort((a, b) => b[1] - a[1])
      .map(([desc]) => ({ label: desc, amount: null, accountId: null, source: 'past' }));

    // Merge — fixed first if not already in past, then past
    const allLabels = new Set();
    const merged = [];
    [...fixedDescs, ...pastDescs].forEach(item => {
      if (!allLabels.has(item.label) && !hidden.includes(item.label)) {
        allLabels.add(item.label);
        merged.push(item);
      }
    });
    return merged;
  },

  showDropdown() {
    Views.inputs.filterDropdown(document.getElementById('txn-desc').value);
  },

  hideDropdown() {
    const dd = document.getElementById('desc-dropdown');
    if (dd) dd.style.display = 'none';
  },

  filterDropdown(query) {
    const dd = document.getElementById('desc-dropdown');
    if (!dd) return;
    const all = Views.inputs.getDescriptions();
    const filtered = query
      ? all.filter(d => d.label.toLowerCase().includes(query.toLowerCase()))
      : all;

    if (!filtered.length) { dd.style.display = 'none'; return; }

    dd.innerHTML = filtered.map(item => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);font-size:0.82rem"
        onmousedown="Views.inputs.selectDescription('${item.label.replace(/'/g,"\\'")}', ${item.amount}, '${item.accountId||''}')">
        <span style="color:var(--text)">${item.label}${item.amount!==null?`<span style="color:var(--text3);font-family:var(--font-mono);font-size:0.72rem;margin-left:8px">${App.fmt(item.amount)}</span>`:''}</span>
        <span style="color:var(--red);font-size:0.8rem;padding:2px 6px;border-radius:4px;margin-left:8px"
          onmousedown="event.stopPropagation();Views.inputs.hideDescription('${item.label.replace(/'/g,"\\'")}')">×</span>
      </div>
    `).join('');
    dd.style.display = 'block';
  },

  selectDescription(label, amount, accountId) {
    document.getElementById('txn-desc').value = label;
    Views.inputs.hideDropdown();

    // Unhide if it was hidden before
    const hidden = App.data.settings.hiddenDescriptions || [];
    if (hidden.includes(label)) {
      App.data.settings.hiddenDescriptions = hidden.filter(h => h !== label);
      App.scheduleSave();
    }

    // Auto-fill account
    if (accountId) {
      const acctEl = document.getElementById('txn-account');
      if (acctEl) acctEl.value = accountId;
    }

    // Auto-fill amount
    if (amount !== null) {
      document.getElementById('txn-amount').value = amount.toFixed(2);
      // Recalculate balance
      const acct = document.getElementById('txn-account').value;
      const current = App.data.accounts[acct] || 0;
      document.getElementById('txn-balance').value = (current + amount).toFixed(2);
    }
  },

  hideDescription(label) {
    if (!App.data.settings.hiddenDescriptions) App.data.settings.hiddenDescriptions = [];
    if (!App.data.settings.hiddenDescriptions.includes(label)) {
      App.data.settings.hiddenDescriptions.push(label);
      App.scheduleSave();
    }
    Views.inputs.filterDropdown(document.getElementById('txn-desc').value);
  },

  applyPreset(type) {
    const rec = App.calc.paycheckRecommendation(
      App.data.paychecks.filter(p=>p.approved).sort((a,b)=>new Date(b.date)-new Date(a.date))[0] || null
    );
    if (type === 'flex') {
      document.getElementById('tf-from').value = 'vault';
      document.getElementById('tf-to').value = 'flex';
      document.getElementById('tf-amount').value = App.calc.flexAllowance().toFixed(2);
      document.getElementById('tf-desc').value = 'Weekly FLEX Allowance';
    } else if (type === 'funds') {
      document.getElementById('tf-from').value = 'vault';
      document.getElementById('tf-to').value = 'funds';
      document.getElementById('tf-amount').value = rec ? rec.toFunds.toFixed(2) : '0.00';
      document.getElementById('tf-desc').value = 'Weekly FUNDS Transfer';
    }
  },

  init() {
    // Auto-calculate balance when amount or account changes
    document.getElementById('txn-amount').addEventListener('input', () => {
      const acct = document.getElementById('txn-account').value;
      const amt = parseFloat(document.getElementById('txn-amount').value) || 0;
      const current = App.data.accounts[acct] || 0;
      document.getElementById('txn-balance').value = (current + amt).toFixed(2);
    });
    document.getElementById('txn-account').addEventListener('change', () => {
      const acct = document.getElementById('txn-account').value;
      const amt = parseFloat(document.getElementById('txn-amount').value) || 0;
      const current = App.data.accounts[acct] || 0;
      document.getElementById('txn-balance').value = (current + amt).toFixed(2);
    });
    // When description is manually typed and matches a hidden item, unhide it on transaction save
  },

  addTransaction() {
    const date = document.getElementById('txn-date').value;
    const accountId = document.getElementById('txn-account').value;
    const description = document.getElementById('txn-desc').value.trim();
    const amount = parseFloat(document.getElementById('txn-amount').value);
    const balance = parseFloat(document.getElementById('txn-balance').value);
    const type = document.getElementById('txn-type').value;

    if (!date || !description || isNaN(amount) || isNaN(balance)) {
      App.showToast('Please fill all fields', 'error'); return;
    }

    // If description was hidden, unhide it now
    const hidden = App.data.settings.hiddenDescriptions || [];
    if (hidden.includes(description)) {
      App.data.settings.hiddenDescriptions = hidden.filter(h => h !== description);
    }

    const txn = { id: App.uid(), accountId, date, description, amount, balance, type, createdAt: new Date().toISOString() };
    App.data.transactions.push(txn);
    App.data.accounts[accountId] = balance;
    if (accountId === 'funds') {
      const r = App.calc.fundsReallocation(balance);
      App.data.fundsSubAccounts = r;
    }
    App.scheduleSave();
    App.showToast('Transaction added', 'success');
    document.getElementById('txn-desc').value = '';
    document.getElementById('txn-amount').value = '';
    document.getElementById('txn-balance').value = '';
  },

  addTransfer() {
    const from = document.getElementById('tf-from').value;
    const to = document.getElementById('tf-to').value;
    const amount = parseFloat(document.getElementById('tf-amount').value);
    const date = document.getElementById('tf-date').value || App.fmtDateInput(new Date());
    const desc = document.getElementById('tf-desc').value.trim() || `Transfer to ${to.toUpperCase()}`;

    if (isNaN(amount) || amount <= 0) { App.showToast('Enter a valid amount', 'error'); return; }
    if (from === to) { App.showToast('From and To must be different', 'error'); return; }

    const creditAccounts = ['cc', 'cc2', 'brex'];
    const fromBal = (App.data.accounts[from] || 0) - amount;
    const toBal = creditAccounts.includes(to)
      ? (App.data.accounts[to] || 0) - amount
      : (App.data.accounts[to] || 0) + amount;

    const id1 = App.uid(), id2 = App.uid();
    App.data.transactions.push({ id: id1, accountId: from, date, description: desc, amount: -amount, balance: fromBal, type: 'transfer', linkedId: id2 });
    App.data.transactions.push({ id: id2, accountId: to, date, description: desc, amount: amount, balance: toBal, type: 'transfer', linkedId: id1 });
    App.data.accounts[from] = fromBal;
    App.data.accounts[to] = toBal;
    if (from === 'funds' || to === 'funds') {
      const r = App.calc.fundsReallocation(App.data.accounts.funds);
      App.data.fundsSubAccounts = r;
    }
    App.scheduleSave();
    App.showToast('Transfer recorded', 'success');
    document.getElementById('tf-amount').value = '';
    document.getElementById('tf-desc').value = '';
  }
};

  renderCard(p) {
    return `<div class="paycheck-card ${p.approved?'approved':'predicted'}">
      <div class="paycheck-header">
        <div>
          <div style="font-size:0.85rem;color:var(--text);font-weight:500">${App.fmtDate(p.date)}</div>

        </div>
        <div>
          <div class="paycheck-net">${App.fmt(p.netPay)}</div>
          <div class="badge ${p.approved?'badge-green':'badge-yellow'}" style="float:right">${p.approved?'Approved':'Predicted'}</div>
        </div>
      </div>

        <div class="paycheck-field"><div class="pf-label">OT hrs</div><div class="pf-val">${p.hours?.overtime||0}</div></div>
        <div class="paycheck-field"><div class="pf-label">Federal Tax</div><div class="pf-val">${App.fmt(p.taxes?.federal)}</div></div>
        <div class="paycheck-field"><div class="pf-label">State/Local</div><div class="pf-val">${App.fmt((p.taxes?.indiana||0)+(p.taxes?.stJoseph||0))}</div></div>
        <div class="paycheck-field"><div class="pf-label">Retirement</div><div class="pf-val">${App.fmt(p.deductions?.retirement)}</div></div>
      </div>
      <div class="paycheck-actions">
        ${!p.approved?`<button class="btn btn-secondary btn-sm" onclick="Views.paychecks.approve('${p.id}')">✓ Approve</button>`:''}
        <button class="btn btn-secondary btn-sm" onclick="Views.paychecks.editModal('${p.id}')">Edit</button>
        <button class="btn btn-danger btn-sm" onclick="Views.paychecks.delete('${p.id}')">Delete</button>
      </div>
    </div>`;
  },
  predict() {
    const hours = {
      regular: parseFloat(document.getElementById('pred-reg').value)||0,
      overtime: parseFloat(document.getElementById('pred-ot').value)||0,
      nightshift: parseFloat(document.getElementById('pred-ns').value)||0,
      holiday: parseFloat(document.getElementById('pred-hol').value)||0,
      pto: parseFloat(document.getElementById('pred-pto').value)||0,
      bonus: parseFloat(document.getElementById('pred-bonus').value)||0
    };
    const customBenefits = parseFloat(document.getElementById('pred-benefits').value);
    const customRetPct   = parseFloat(document.getElementById('pred-ret-pct').value);
    const customOther    = parseFloat(document.getElementById('pred-other').value);

    // Temporarily override settings for this prediction
    const origBenefits = App.data.settings.benefitsDeduction;
    const origRetPct   = App.data.settings.retirementPercent;
    const origOther    = App.data.settings.otherDeductions;
    if (!isNaN(customBenefits)) App.data.settings.benefitsDeduction = customBenefits;
    if (!isNaN(customRetPct))   App.data.settings.retirementPercent = customRetPct;
    if (!isNaN(customOther))    App.data.settings.otherDeductions   = customOther;

    const r = App.calc.predictNetPay(hours);

    // Restore
    App.data.settings.benefitsDeduction = origBenefits;
    App.data.settings.retirementPercent = origRetPct;
    App.data.settings.otherDeductions   = origOther;

    const retirementAmt = r.gross * ((isNaN(customRetPct)?App.data.settings.retirementPercent:customRetPct)/100);
    const benefitsAmt   = isNaN(customBenefits) ? App.data.settings.benefitsDeduction : customBenefits;
    const otherAmt      = isNaN(customOther)    ? App.data.settings.otherDeductions    : customOther;

    document.getElementById('pred-result').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="balance-card"><div class="label">Gross Pay</div><div class="amount neutral" style="font-size:1.1rem">${App.fmt(r.gross)}</div></div>
        <div class="balance-card"><div class="label">Net Pay</div><div class="amount pos" style="font-size:1.1rem">${App.fmt(r.net)}</div></div>
        <div class="balance-card"><div class="label">Total Taxes</div><div class="amount neg" style="font-size:1rem">${App.fmt(r.taxes)}</div></div>
        <div class="balance-card"><div class="label">Retirement (${isNaN(customRetPct)?App.data.settings.retirementPercent:customRetPct}%)</div><div class="amount neutral" style="font-size:1rem">${App.fmt(retirementAmt)}</div></div>
        <div class="balance-card"><div class="label">Benefits</div><div class="amount neutral" style="font-size:1rem">${App.fmt(benefitsAmt)}</div></div>
        <div class="balance-card"><div class="label">Other Deductions</div><div class="amount neutral" style="font-size:1rem">${App.fmt(otherAmt)}</div></div>
      </div>`;
  },
  openAddModal() {
    const nextPay = App.calc.nextPaycheckDate();
    const workEnd = new Date(nextPay); workEnd.setDate(nextPay.getDate()-7);
    const s = App.data.settings;

    // ── Calculate average tax rates from approved paychecks in current year ──
    const currentYear = new Date().getFullYear();
    const approved = App.data.paychecks.filter(p => p.approved && new Date(p.date).getFullYear() === currentYear);
    const allApproved = App.data.paychecks.filter(p => p.approved);
    const pool = approved.length ? approved : allApproved;
    let rates = { federal: 0.12, socialSecurity: 0.062, medicare: 0.0145, indiana: 0.0323, stJoseph: 0.0175 };
    if (pool.length > 0) {
      const totG = pool.reduce((a, p) => a + (p.grossPay || 0), 0);
      if (totG > 0) {
        rates.federal = pool.reduce((a, p) => a + (p.taxes?.federal || 0), 0) / totG;
        rates.socialSecurity = pool.reduce((a, p) => a + (p.taxes?.socialSecurity || 0), 0) / totG;
        rates.medicare = pool.reduce((a, p) => a + (p.taxes?.medicare || 0), 0) / totG;
        rates.indiana = pool.reduce((a, p) => a + (p.taxes?.indiana || 0), 0) / totG;
        rates.stJoseph = pool.reduce((a, p) => a + (p.taxes?.stJoseph || 0), 0) / totG;
      }
    }

    // ── Calculate initial estimate based on default 36 regular hours ──
    const initEstimate = App.calc.predictNetPay({ regular: 36, overtime: 0, nightshift: 0, holiday: 0, pto: 0, bonus: 0 });

    App.openModal(`
      <div class="modal-title">Add Paycheck</div>
      <div class="form-row">
        <div class="form-group"><label>Paycheck Date</label><input type="date" id="m-pay-date" value="${App.fmtDateInput(nextPay)}"></div>
        <div class="form-group"><label>Work Week End</label><input type="date" id="m-wwe" value="${App.fmtDateInput(workEnd)}"></div>

      <div class="form-row">
        <div class="form-group"><label>Regular hrs</label><input type="number" id="m-reg" value="36" step="0.5" min="0" oninput="Views.paychecks.recalcModal()"></div>
        <div class="form-group"><label>Overtime hrs</label><input type="number" id="m-ot" value="0" step="0.5" min="0" oninput="Views.paychecks.recalcModal()"></div>
        <div class="form-group"><label>Nightshift hrs</label><input type="number" id="m-ns" value="0" step="0.5" min="0" oninput="Views.paychecks.recalcModal()"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Holiday hrs</label><input type="number" id="m-hol" value="0" step="0.5" min="0" oninput="Views.paychecks.recalcModal()"></div>
        <div class="form-group"><label>PTO hrs</label><input type="number" id="m-pto" value="0" step="0.5" min="0" oninput="Views.paychecks.recalcModal()"></div>
        <div class="form-group"><label>Bonus $</label><input type="number" id="m-bonus" value="0" step="0.01" oninput="Views.paychecks.recalcModal()"></div>
      </div>
      <div style="font-size:0.7rem;color:var(--accent);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.07em;margin:14px 0 8px;padding-top:10px;border-top:1px solid var(--border)">Deductions</div>
      <div class="form-row">
        <div class="form-group"><label>Benefits ($)</label><input type="number" id="m-benefits" value="${s.benefitsDeduction}" step="0.01" min="0" oninput="Views.paychecks.recalcModal()"></div>
        <div class="form-group"><label>Retirement (%)</label><input type="number" id="m-ret-pct" value="${s.retirementPercent}" step="0.1" min="0" max="100" oninput="Views.paychecks.recalcModal()"></div>
        <div class="form-group"><label>Other Deductions ($)</label><input type="number" id="m-other" value="${s.otherDeductions}" step="0.01" min="0" oninput="Views.paychecks.recalcModal()"></div>
      </div>
      <div style="font-size:0.7rem;color:var(--accent);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.07em;margin:14px 0 8px;padding-top:10px;border-top:1px solid var(--border)">
        Taxes — estimated from your average rates · edit if you have actual amounts
      </div>
      <div class="form-row">
        <div class="form-group"><label>Federal Tax</label><input type="number" id="m-fed" value="${(initEstimate.gross * rates.federal).toFixed(2)}" step="0.01"></div>
        <div class="form-group"><label>SS Tax</label><input type="number" id="m-ss" value="${(initEstimate.gross * rates.socialSecurity).toFixed(2)}" step="0.01"></div>
        <div class="form-group"><label>Medicare</label><input type="number" id="m-med" value="${(initEstimate.gross * rates.medicare).toFixed(2)}" step="0.01"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Indiana Tax</label><input type="number" id="m-ind" value="${(initEstimate.gross * rates.indiana).toFixed(2)}" step="0.01"></div>
        <div class="form-group"><label>St. Joseph Tax</label><input type="number" id="m-stj" value="${(initEstimate.gross * rates.stJoseph).toFixed(2)}" step="0.01"></div>
        <div class="form-group"><label>Net Pay (override)</label><input type="number" id="m-net" value="0" step="0.01" placeholder="Leave 0 to auto-calculate"></div>
      </div>
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;margin-top:8px;display:flex;gap:24px;flex-wrap:wrap">
        <div><div style="font-size:0.65rem;color:var(--text3);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.07em">Gross Pay</div><div id="m-summary-gross" style="font-family:var(--font-mono);font-size:1rem;color:var(--text);margin-top:3px">${App.fmt(initEstimate.gross)}</div></div>
        <div><div style="font-size:0.65rem;color:var(--text3);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.07em">Total Taxes</div><div id="m-summary-taxes" style="font-family:var(--font-mono);font-size:1rem;color:var(--red);margin-top:3px">${App.fmt(initEstimate.gross * (rates.federal + rates.socialSecurity + rates.medicare + rates.indiana + rates.stJoseph))}</div></div>
        <div><div style="font-size:0.65rem;color:var(--text3);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.07em">Est. Net Pay</div><div id="m-summary-net" style="font-family:var(--font-mono);font-size:1rem;color:var(--green);margin-top:3px">${App.fmt(initEstimate.net)}</div></div>
      </div>
      <div class="form-row" style="margin-top:12px">
        <div class="form-group"><label>Status</label>
          <select id="m-approved"><option value="false">Predicted</option><option value="true">Approved</option></select>
        </div>
      </div>

        <button class="btn btn-secondary" onclick="App.closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="Views.paychecks.saveFromModal()">Save Paycheck</button>
      </div>
    `);

    // Store rates on the window so recalcModal can access them
    window._paycheckRates = rates;
  },

  recalcModal() {
    const s = App.data.settings;
    const rates = window._paycheckRates;
    if (!rates) return;

    const hours = {
      regular: parseFloat(document.getElementById('m-reg').value) || 0,
      overtime: parseFloat(document.getElementById('m-ot').value) || 0,
      nightshift: parseFloat(document.getElementById('m-ns').value) || 0,
      holiday: parseFloat(document.getElementById('m-hol').value) || 0,
      pto: parseFloat(document.getElementById('m-pto').value) || 0,
      bonus: parseFloat(document.getElementById('m-bonus').value) || 0
    };

    const gross = hours.regular * s.regularRate
      + hours.overtime * s.regularRate * s.overtimeMultiplier
      + hours.nightshift * s.regularRate * s.nightshiftMultiplier
      + hours.holiday * s.regularRate
      + hours.pto * s.regularRate
      + hours.bonus;

    const benefits = parseFloat(document.getElementById('m-benefits').value) || 0;
    const retPct = parseFloat(document.getElementById('m-ret-pct').value) || 0;
    const other = parseFloat(document.getElementById('m-other').value) || 0;
    const retirement = gross * (retPct / 100);

    const fed = gross * rates.federal;
    const ss = gross * rates.socialSecurity;
    const med = gross * rates.medicare;
    const ind = gross * rates.indiana;
    const stj = gross * rates.stJoseph;
    const totalTax = fed + ss + med + ind + stj;
    const net = gross - totalTax - retirement - benefits - other;

    document.getElementById('m-fed').value = fed.toFixed(2);
    document.getElementById('m-ss').value = ss.toFixed(2);
    document.getElementById('m-med').value = med.toFixed(2);
    document.getElementById('m-ind').value = ind.toFixed(2);
    document.getElementById('m-stj').value = stj.toFixed(2);

    const grossEl = document.getElementById('m-summary-gross');
    const taxEl = document.getElementById('m-summary-taxes');
    const netEl = document.getElementById('m-summary-net');
    if (grossEl) grossEl.textContent = App.fmt(gross);
    if (taxEl) taxEl.textContent = App.fmt(totalTax);
    if (netEl) netEl.textContent = App.fmt(net);
  },
  saveFromModal(id) {
    const hours = {
      regular: parseFloat(document.getElementById('m-reg').value)||0,
      overtime: parseFloat(document.getElementById('m-ot').value)||0,
      nightshift: parseFloat(document.getElementById('m-ns').value)||0,
      holiday: parseFloat(document.getElementById('m-hol').value)||0,
      pto: parseFloat(document.getElementById('m-pto').value)||0,
    };
    const bonus = parseFloat(document.getElementById('m-bonus').value)||0;
    const approved = document.getElementById('m-approved').value==='true';
    const taxes = {
      federal: parseFloat(document.getElementById('m-fed').value)||0,
      socialSecurity: parseFloat(document.getElementById('m-ss').value)||0,
      medicare: parseFloat(document.getElementById('m-med').value)||0,
      indiana: parseFloat(document.getElementById('m-ind').value)||0,
      stJoseph: parseFloat(document.getElementById('m-stj').value)||0
    };
    let netPay = parseFloat(document.getElementById('m-net').value)||0;
    const date = document.getElementById('m-pay-date').value;
    const workWeekEnd = document.getElementById('m-wwe').value;

    // Read editable deductions from modal (fall back to settings if fields missing)
    const benefitsVal  = document.getElementById('m-benefits')  ? parseFloat(document.getElementById('m-benefits').value)  : App.data.settings.benefitsDeduction;
    const retPctVal    = document.getElementById('m-ret-pct')   ? parseFloat(document.getElementById('m-ret-pct').value)   : App.data.settings.retirementPercent;
    const otherVal     = document.getElementById('m-other')     ? parseFloat(document.getElementById('m-other').value)     : App.data.settings.otherDeductions;

    // Temporarily use modal values for prediction
    const origBenefits = App.data.settings.benefitsDeduction;
    const origRetPct   = App.data.settings.retirementPercent;
    const origOther    = App.data.settings.otherDeductions;
    App.data.settings.benefitsDeduction = isNaN(benefitsVal) ? origBenefits : benefitsVal;
    App.data.settings.retirementPercent = isNaN(retPctVal)   ? origRetPct   : retPctVal;
    App.data.settings.otherDeductions   = isNaN(otherVal)    ? origOther    : otherVal;

    const pred = App.calc.predictNetPay({...hours, bonus});
    const grossPay = pred.gross;
    if (!netPay) netPay = pred.net;

    const deductions = {
      benefits:   App.data.settings.benefitsDeduction,
      retirement: grossPay * (App.data.settings.retirementPercent / 100),
      other:      App.data.settings.otherDeductions
    };

    // Restore settings
    App.data.settings.benefitsDeduction = origBenefits;
    App.data.settings.retirementPercent = origRetPct;
    App.data.settings.otherDeductions   = origOther;

    if (id) {
      const idx = App.data.paychecks.findIndex(p=>p.id===id);
      if (idx>=0) App.data.paychecks[idx] = {...App.data.paychecks[idx], date, workWeekEnd, hours, bonus, grossPay, taxes, deductions, netPay, approved};
    } else {
      App.data.paychecks.push({id:App.uid(), date, workWeekEnd, hours, bonus, grossPay, taxes, deductions, netPay, approved});
    }
    App.scheduleSave(); App.closeModal(); App.renderCurrentView();
    App.showToast('Paycheck saved','success');
  },
  editModal(id) {
    const p = App.data.paychecks.find(x=>x.id===id);
    if(!p) return;
    const s = App.data.settings;
    App.openModal(`
      <div class="modal-title">Edit Paycheck</div>
      <div class="form-row">
        <div class="form-group"><label>Paycheck Date</label><input type="date" id="m-pay-date" value="${App.fmtDateInput(p.date)}"></div>

      <div class="form-row">
        <div class="form-group"><label>Regular hrs</label><input type="number" id="m-reg" value="${p.hours?.regular||0}" step="0.5"></div>
        <div class="form-group"><label>Overtime hrs</label><input type="number" id="m-ot" value="${p.hours?.overtime||0}" step="0.5"></div>
        <div class="form-group"><label>Nightshift hrs</label><input type="number" id="m-ns" value="${p.hours?.nightshift||0}" step="0.5"></div>
      </div>
      <div class="form-row">

        <div class="form-group"><label>PTO hrs</label><input type="number" id="m-pto" value="${p.hours?.pto||0}" step="0.5"></div>
        <div class="form-group"><label>Bonus $</label><input type="number" id="m-bonus" value="${p.bonus||0}" step="0.01"></div>
      </div>
      <div style="font-size:0.7rem;color:var(--accent);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.07em;margin:14px 0 8px;padding-top:10px;border-top:1px solid var(--border)">Deductions</div>
      <div class="form-row">
        <div class="form-group"><label>Benefits ($)</label><input type="number" id="m-benefits" value="${p.deductions?.benefits??s.benefitsDeduction}" step="0.01" min="0"></div>
        <div class="form-group"><label>Retirement (%)</label><input type="number" id="m-ret-pct" value="${s.retirementPercent}" step="0.1" min="0" max="100"></div>
        <div class="form-group"><label>Other Deductions ($)</label><input type="number" id="m-other" value="${p.deductions?.other??s.otherDeductions}" step="0.01" min="0"></div>
      </div>
      <div style="font-size:0.7rem;color:var(--accent);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.07em;margin:14px 0 8px;padding-top:10px;border-top:1px solid var(--border)">Taxes</div>
      <div class="form-row">
        <div class="form-group"><label>Federal Tax</label><input type="number" id="m-fed" value="${p.taxes?.federal||0}" step="0.01"></div>
        <div class="form-group"><label>SS Tax</label><input type="number" id="m-ss" value="${p.taxes?.socialSecurity||0}" step="0.01"></div>
        <div class="form-group"><label>Medicare</label><input type="number" id="m-med" value="${p.taxes?.medicare||0}" step="0.01"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Indiana Tax</label><input type="number" id="m-ind" value="${p.taxes?.indiana||0}" step="0.01"></div>
        <div class="form-group"><label>St. Joseph Tax</label><input type="number" id="m-stj" value="${p.taxes?.stJoseph||0}" step="0.01"></div>
        <div class="form-group"><label>Net Pay (override)</label><input type="number" id="m-net" value="${p.netPay||0}" step="0.01"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Status</label>
          <select id="m-approved"><option value="false" ${!p.approved?'selected':''}>Predicted</option><option value="true" ${p.approved?'selected':''}>Approved</option></select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="App.closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="Views.paychecks.saveFromModal('${id}')">Save</button>
      </div>
    `);
  },
  approve(id) {
    const p = App.data.paychecks.find(x=>x.id===id);
    if(p) { p.approved=true; App.scheduleSave(); App.renderCurrentView(); App.showToast('Paycheck approved','success'); }
  },
  delete(id) {
    if(!confirm('Delete this paycheck?')) return;
    App.data.paychecks = App.data.paychecks.filter(p=>p.id!==id);
    App.scheduleSave(); App.renderCurrentView();
  },
  init() {
    const approved = App.data.paychecks.filter(p=>p.approved).sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(-12);
    if (approved.length && typeof Chart !== 'undefined') {
      App.charts['pay-chart'] = new Chart(document.getElementById('pay-chart'), {
        type:'line',
        data:{labels:approved.map(p=>App.fmtDate(p.date)),datasets:[{label:'Net Pay',data:approved.map(p=>p.netPay),borderColor:'#6db891',backgroundColor:'rgba(109,184,145,0.1)',tension:0.3,pointRadius:3,fill:true}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#6a6460',font:{size:9}},grid:{color:'rgba(46,46,56,0.6)'}},y:{ticks:{color:'#6a6460',callback:v=>'$'+v.toLocaleString(),font:{size:10}},grid:{color:'rgba(46,46,56,0.6)'}}}}

};
